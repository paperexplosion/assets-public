    <textarea id="original-markdown" style="display:none;"># 浅賀さん商談分析＆今後の戦略

## 1. 見積もり削除の事実
- 削除された項目
  - YouTubeコンサル
  - P&D（企画・演出）
  - 編集
  - →すべて「ソフト（目に見えない）仕事」
- 根本原因
  - ソフトの仕事にはお金がかからないという認識
  - 業界全体に根付いた意識

## 2. 業界の意識構造
- 現場作業員が帰れない文化
- 国が働き方改革法で規制が必要なレベル
- この意識は今もまだ変わっていない
- クリエイティブの価値が認められにくい

## 3. 浅賀さんの特性と限界
- 強み
  - 変えたい意志はある
  - 採用問題への危機感
- 弱点
  - マーケティング数値は苦手
  - 評判・口コミで判断するタイプ
  - 本社を説得する力がない
- 組織の壁
  - 高橋さんも変えたいがコネに勝てない
  - 社内政治・既存人脈が障壁

## 4. 浅賀さんの本音（仮説）
- 採用対策としてYouTubeでPRしたい
- 発注者によく思われたい＝営業施策
- 目的自体は間違っていない
- ただし本社承認の壁がある

## 5. 打ち合わせ戦術
- 数字・マーケ話は控えめに
- 本社・支店・発注者の評判を聞き出す
- 質問を投げかけて気づかせる誘導法
- 感情・評判から入るアプローチ

## 6. プライシング戦略の見直し
- 現行プラン
  - 月100万〜
- 新案
  - 月50万プランも追加
  - 年間600万 → 予算承認が通りやすい
  - 現場単位での発注を想定

## 7. 営業モデルの転換
- 現行：サブスクモデル
- 新案：単発営業モデル
  - 現場単位で直接営業
  - 受注→撮影→YouTubeチャンネル配信
  - 1件ずつ積み上げる
  - 良い実績を他社営業に活用

## 8. リスクと現実認識
- 月50万 = 2倍の案件数が必要
- 儲かる感覚は薄れる
- でも現実を見る必要がある
- 「小さいことからコツコツ」戦略
- 成功事例を積み上げて横展開</textarea>

    <script>
      (function() {
        const exportToolbar = document.createElement('div');
        exportToolbar.className = 'mm-export-toolbar';
        document.body.appendChild(exportToolbar);
        
        const pngBtn = document.createElement('button');
        pngBtn.className = 'mm-export-btn png-export';
        pngBtn.innerHTML = 'Export PNG';
        pngBtn.onclick = () => { exportToImage('png'); };
        exportToolbar.appendChild(pngBtn);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'mm-export-btn mm-copy-btn copy-markdown';
        copyBtn.innerHTML = 'Copy Markdown';
        copyBtn.onclick = copyOriginalMarkdown;
        exportToolbar.appendChild(copyBtn);

        function copyOriginalMarkdown() {
          const markdownElement = document.getElementById('original-markdown');
          navigator.clipboard.writeText(markdownElement.value);
        }

        function exportToImage(format) {
          const node = window.mm.svg._groups[0][0];
          window.mm.fit().then(() => {
            htmlToImage.toPng(node, {backgroundColor: '#ffffff', quality: 1.0})
              .then((dataUrl) => {
                const link = document.createElement('a');
                link.download = 'markmap-asaga-shodan.png';
                link.href = dataUrl;
                link.click();
              });
          });
        }
      })();
