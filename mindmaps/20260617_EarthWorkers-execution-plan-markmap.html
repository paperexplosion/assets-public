    <textarea id="original-markdown" style="display:none;"># EarthWorkers 実行計画

## 事業概要
- スモールフィルム株式会社（smallfilm.co.jp）
- 土木建設業界向けドキュメンタリーマーケティング
- 鈴木（戦略）× Kudo（映像制作）の共同事業
- ビジネスモデル：業界売上10%成長 × 1% = 報酬

## キーマン2人
### Asaga所長（Wakachiku Kensetsu）
- Kudoさんと1年間のYouTube取り組み実績
- 高視聴回数を達成
- 武器：数値で語れる動く証拠
- 急務：YouTube実績を数値化（視聴回数・求人応募増加数）

### Kotobuki社長（ことぶき建設）
- ドキュメンタリー映像「bungodokko（文語読講）」あり
- 展示会・業界フェアへの登壇意欲旺盛
- 武器：業界への影響力・動く軸
- Kudoさんの既存クライアント（紹介元）

## 実行計画
### Phase 1（今すぐ〜1ヶ月）：基盤確認・打診
- Kudo：Asaga所長にYouTube数値を確認
- 鈴木：土木業界展示会スケジュール調査
- Kudo：Kotobuki社長に展示会登壇打診

### Phase 2（1〜3ヶ月）：証拠作成・仕組み設計
- 鈴木：Wakachiku事例シート1枚作成（課題→プロセス→成果 数値3点）
- 両者：展示会後フォローフロー設計（誰が・いつ・何を送る）

### Phase 3（3〜6ヶ月）：展示会実施・リード獲得
- Kotobuki社長 × 業界展示会登壇
- 名刺交換 → 動画送付 → アポ入れフロー実行
- 鈴木：フォローセミナー設計開始

### Phase 4（6ヶ月〜1年）：スケール・デジタル展開
- 展示会接触者への共催セミナー実施
- 事例3社達成 → ホワイトペーパー作成
- リスティング広告展開

## 3カ年ゴール
- 1年目：Kotobuki/Wakachiku周辺で3〜5社受注確立
- 2年目：紹介スノーボール起動（1社→3社→9社）
- 3年目：業界フェア×セミナーで渦を起こす / デジタル展開

## B2Bマーケ書籍 照合結果
### 方向性は正しい。優先順位の設計がすべて。
- ニッチ×業界特化 → 展示会優先 → Kotobuki登壇と完全一致
- YouTube × B2B相性最良 → Asaga所長実績が最強の証拠
- 受注に近い施策から順番に → Kotobuki/Wakachiku周辺で固める
- 事例は課題・プロセス・成果の数値3点 → 数値化が急務

- diagram_05：紹介システム設計フロー（スノーボール構造）
- diagram_06：超ユースケース3パターン

              };
              
              const exportPromise = format === 'svg' 
                ? htmlToImage.toSvg(node, options)
                : format === 'jpeg' 
                  ? htmlToImage.toJpeg(node, options) 
                  : htmlToImage.toPng(node, options);
              
              exportPromise
                .then((dataUrl) => {
                  const link = document.createElement('a');
                  const timestamp = new Date().toISOString().slice(0, 10);
                  link.download = `markmap-${timestamp}.${format === 'jpeg' ? 'jpg' : format === 'svg' ? 'svg' : 'png'}`;
                  link.href = dataUrl;
                  link.click();
                })
                .catch((err) => console.error("Export failed:", err));
            })
            .catch((err) => {
                throw err;
            });
              
          } catch (e) {
            console.error('Error exporting image:', e);
            alert('Image export failed: ' + e.message);
          }
        }
      })();
    </script>
  
</body>
</html>
