    <textarea id="original-markdown" style="display:none;"># 若竹建設 YouTube・マーケティング打ち合わせ（2026-06-12 11:04）

## 1. スケジュール管理の構造的問題
### 三重の時間軸のズレ
- **撮影側**：半月で出してと言われる
- **チェック側**：編集・チェックに1ヶ月必要
- **発注者側**：戻ってくるのに2〜3ヶ月（去年の実例）
  - 結果：せっかく早く作っても配信ベースに乗らない
  - 責任の所在が曖昧になる（「遅れたじゃん」と言われた）
### 現場若手スタッフ問題
- 独自にスケジュールを切ってくる
- 本社方針・制作側の事情を知らない
- 「これやりなさい」と上から降ってくる形になる
- 現場の人間が発注者に言いにくい（立場的に）
  - 業者（外人部隊）だから逆に言える→お墨付きとして活用可能
### 国交省チェック問題
- 去年実際に起きた問題
  - 所長と話すシーンに国交省職員が映り込んでいた
  - それ以外はノーチェックだった
- 解決策：国交省来訪を事前に把握して撮影しないだけで解決
- 結論：国交省チェック自体は不要ではないか
  - チェックが「いつになるかわからない」と管理不能になる
- 安全部チェック・高さチェックは別途必要（構造的問題の確認）

## 2. 本社と現場の連携断絶
### 後出し要求の構造
- 撮影完了後に「写真全部送って」という依頼が頻発
  - 「撮ってないですよ」「もうお渡ししています」のループ
  - 発注者・複数クライアントどちらも同じ問題
- ポスター用・カレンダー用の素材要求が事前に来ない
  - A4サイズがギリギリの画像でポスターは無理
  - 高解像度でちゃんと撮るしかない
### 撮影機材の制約
- 写真とビデオの同時撮影は人員が必要
  - 一瞬で終わる作業は切り替えが間に合わない
  - 2台同時運用→予算増加
  - 「いらない」となるが後で「取っとけばよかった」
- ドローンはビデオ↔写真モード切り替え可能（スマホと同じ）
  - ただし同時撮影はできない
### 本社が管理していない問題
- 本社がYouTubeを管理・指示していないから現場まかせになる
- 本社から「月一配信しなさい」という使命があれば
  - チェック催促も本社名義で言いやすくなる
  - 発注者へのプレッシャーになる

## 3. 映像制作業界の構造理解（業者側の説明）

- おだてれば動く・ギャラを積めば何でもやる

- 「あなたのためなら何でもする」になればベスト
### 制作会社の立ち位置

## 5. YouTube解析・データドリブン戦略
### YouTube解析権限の設定
- 権限の種類：管理者 / コンテンツマネージャー / エディター / 閲覧者
- 解析だけなら「閲覧者」権限で十分

  - 鈴木のメールアドレスを入れるだけで完了

- セキュリティ上の契約書締結が望ましい
### 解析で何がわかるか
- 視聴者の属性・流入元
- どのコンテンツが当たっているか
- 視聴者インサイトの数値化
- Googleアナリティクス（Web）との連携でさらに深掘り
### KPIの考え方
- KPIは正しくなければ全員が間違った方向に走る
- 感覚で動くのが一番危険（映像屋は映像の感覚で判断しがち）

- KPIは継続的に修正していく必要がある

## 6. BtoBマーケティングとしてのYouTube
### 世界的トレンドとの乖離
- 世界：BtoC < BtoBにマーケティング投資するのが常識
- TikTok・YouTubeをBtoBに使うのが当たり前
- 日本の建設業界：ほぼ誰もやっていない
### 若竹建設の現状
- YouTubeは「発注者への動画提出」の派生物として始まった
- 義務で作った動画をせっかくだから上げている状態
- 社内に動画作成チームはある
- ただしYouTube専門として動かせていない
- バズっているものはあるがリソースが足りない
### 長期的なメリット
- 海外案件獲得時に実績が一目でわかる
- ホームページで実績が見える会社 vs 見えない会社の差
- 採用強化への貢献（人事部の関心が一番高い）

## 7. ブランディング・CI統一の課題
### 現状の問題点

  - 画像・動画の品質・テイストにばらつき
- CIが実質的に機能していない
### 現在の制作体制
- 長崎の代理店（長崎放送系？）が長年担当
  - キャラ・ロゴも長崎の会社が制作
  - パイプが強い（コネクション依存）
  - クリエイティブとしての品質は低い（素人的）
  - 地方CM的な見た目になっている
- SS社（別のデザイン会社）
  - US（UX/UI）デザイン担当
  - 画像はそちらから来る
- 複数業者が絡み合って統一感が出ない
### 改善に向けた構造
- ブランディングポリシーを会社が決める
  - 決まってから全業者に落とす
  - そうすると自然とイメージが共通化される
- 広報ワーキンググループが設立されている（会長・専務クラスが関与）
  - やりにくいが存在している
  - そこに早めに入り込む戦略
### 社内ワークショップ提案
- 高橋さん主催で実施
- 制作チームがワークショップを設計
- 社内ヒアリング→ブランディング方針に落とし込む
- 納得感が生まれる・意見を集めやすい
- 材料リストとして宿題形式で渡す

        // Function to copy original Markdown content
        function copyOriginalMarkdown() {
          try {
            const markdownElement = document.getElementById('original-markdown');
            if (!markdownElement) {
              throw new Error('Original Markdown content not found');
            }
            
            const markdownContent = markdownElement.value;
            
            // Copy to clipboard
            navigator.clipboard.writeText(markdownContent)
              .then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✓ Copied';
                copyBtn.style.backgroundColor = '#2ecc71';
                
                setTimeout(() => {
                  copyBtn.innerHTML = originalText;
                  copyBtn.style.backgroundColor = '';
                }, 2000);
              })
              .catch(err => {
                console.error('Copy failed:', err);
                alert('Failed to copy to clipboard, please check browser permissions');
              });
          } catch (e) {
            console.error('Error copying Markdown:', e);
            alert('Unable to copy Markdown: ' + e.message);
          }
        }

        // Function to export image
        function exportToImage(format) {
          try {
            const node = window.mm.svg._groups[0][0];
            
            if (!node) {
              throw new Error('Cannot find mind map SVG element');
            }

            window.mm.fit().then(() => {
              const options = {
                backgroundColor: "#ffffff", 
                quality: 1.0,
                width: node.getBoundingClientRect().width,
                height: node.getBoundingClientRect().height
              };
              
              const exportPromise = format === 'svg' 
                ? htmlToImage.toSvg(node, options)
                : format === 'jpeg' 
                  ? htmlToImage.toJpeg(node, options) 
                  : htmlToImage.toPng(node, options);
              
              exportPromise
                .then((dataUrl) => {
                  const link = document.createElement('a');
                  const timestamp = new Date().toISOString().slice(0, 10);
                  link.download = `markmap-${timestamp}.${format === 'jpeg' ? 'jpg' : format === 'svg' ? 'svg' : 'png'}`;
                  link.href = dataUrl;
                  link.click();
                })
                .catch((err) => console.error("Export failed:", err));
            })
            .catch((err) => {
                throw err;
            });
              
          } catch (e) {
            console.error('Error exporting image:', e);
            alert('Image export failed: ' + e.message);
          }
        }
