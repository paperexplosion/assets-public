    <textarea id="original-markdown" style="display:none;"># smallfilm・Earth・映像ビジネス戦略

## smallfilm（個人映画会社）
### 世界観・ポジション
- 個人映画会社的・小商的世界観で温存
- BtoBなし → small BtoCとのコラボ
- オルタナティブなクリエイティブの場
- Earthとは切り離す（独立検討の余地あり）
### マネタイズ
- YouTubeチャンネル＋スポンサー企業への販売
- small is beautiful の価値観を伝える
### ブランドドメイン取得予定
- 名刺作戦スタート
- 気合いを入れるためのドメイン取得

## EarthWorkers（メイン事業）
### ビジネスモデル
- 土木業界へのドキュメンタリーマーケティング
- 業界売上10%拡張の1%をいただくモデル
### 成長ロードマップ
- うまく行けば → smallへ発展
- さらに → Moon Worksへ発展
### 既存実績
- Kotoki Kensetsuに映像実績あり

## Moon Works（将来構想）
### コンセプト
- 編集スタジオ
- 月の仕事・夜の仕事
- 人が寝ている間にやる機織り的
### 設立条件
- Earthが成長したら設立

## 日本映像市場の課題
### 業界構造問題
- マーケから動画参入した人→映像センスゼロ（eviry等）
- テレビ業界が日本スタンダードを形成してしまった
### クリエイターの現状
- シネマティ;&#x30c3;ククリエイター → 自己満足以外メリットなし
- NetflixやAmazon Primeで競争が生まれれば食える人が増える可能性
### 登竜門市場の創造
- YouTubeやSNSが登竜門的映像ビジネスマーケットになれると良い

## グロ;&#x30fc;バル戦略（Saitoさん情報）
### 海外需要
- 海外ハイブランド・BBCが日本クリエイターを探している
- 向こうのスタッフより安く・グローバル品質で提供できれば仕事が取れる
### 実行計画
- シネマティック実績を謳うグローバル向けサイトを作る
- 国内外両方で強みになる映像集団を目指す

## パトロン・スポンサー戦略
### Julianさん流
- ハイブランドをパトロンに（日本では難しい）
- ラグジュアリーマーケットでオリジナル作品→スポンサード獲得
### 日本での接点
- エルメス日本会長との接点あり（昭和的バブル成金趣味が一部残存）
- Morisakiさんのような「お金はないが気位が高い経営者」を探す

## 次のアクション
### ブレスト予定
- Saitoさん・Kogureくんなどでブレスト
- Suzuにマーケプランを立ててもらう
### コンテンツ企画
- Shimizuくんの新スイッチング機器でライブ配信コンテンツ企画
- ナラティブ設計でどこまでビジネスを作れるか追求

## ビジネスモデル哲学
- small is beautiful
- 日本からグローバルへ
- オリジナル作品が先・スポンサーは後
- 登竜門的マーケットの創造

        svgBtn.innerHTML = 'Export SVG';
        svgBtn.title = 'Export as SVG image';
        svgBtn.onclick = () => {
          exportToImage('svg');
        };
        exportToolbar.appendChild(svgBtn);

        // Copy original Markdown button
        const copyBtn = document.createElement('button');
        copyBtn.className = 'mm-export-btn mm-copy-btn copy-markdown';
        copyBtn.innerHTML = 'Copy Markdown';
        copyBtn.title = 'Copy original Markdown content';
        copyBtn.onclick = copyOriginalMarkdown;
        exportToolbar.appendChild(copyBtn);

        // Function to copy original Markdown content
        function copyOriginalMarkdown() {
          try {
            const markdownElement = document.getElementById('original-markdown');
            if (!markdownElement) {
              throw new Error('Original Markdown content not found');
            }
            
            const markdownContent = markdownElement.value;
            
            // Copy to clipboard
            navigator.clipboard.writeText(markdownContent)
              .then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✓ Copied';
                copyBtn.style.backgroundColor = '#2ecc71';
                
                setTimeout(() => {
                  copyBtn.innerHTML = originalText;
                  copyBtn.style.backgroundColor = '';
                }, 2000);
              })
              .catch(err => {
                console.error('Copy failed:', err);
                alert('Failed to copy to clipboard, please check browser permissions');
              });
          } catch (e) {
            console.error('Error copying Markdown:', e);
            alert('Unable to copy Markdown: ' + e.message);
          }
        }

        // Function to export image
        function exportToImage(format) {
          try {
            const node = window.mm.svg._groups[0][0];
            
            if (!node) {
              throw new Error('Cannot find mind map SVG element');
            }

            window.mm.fit().then(() => {
              const options = {
                backgroundColor: "#ffffff", 
                quality: 1.0,
                width: node.getBoundingClientRect().width,
                height: node.getBoundingClientRect().height
              };
              
              const exportPromise = format === 'svg' 
                ? htmlToImage.toSvg(node, options)
                : format === 'jpeg' 
                  ? htmlToImage.toJpeg(node, options) 
                  : htmlToImage.toPng(node, options);
              
              exportPromise
                .then((dataUrl) => {
                  const link = document.createElement('a');
                  const timestamp = new Date().toISOString().slice(0, 10);
                  link.download = `markmap-${timestamp}.${format === 'jpeg' ? 'jpg' : format === 'svg' ? 'svg' : 'png'}`;
                  link.href = dataUrl;
                  link.click();
                })
                .catch((err) => console.error("Export failed:", err));
            })
            .catch((err) => {
                throw err;
            });
              
          } catch (e) {
            console.error('Error exporting image:', e);
            alert('Image export failed: ' + e.message);
          }
        }
      })();
    </script>
  
</body>
</html>
