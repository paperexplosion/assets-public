<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1400px; height: 900px; overflow: hidden;
    background: #EEF2FF;
    font-family: 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  }
  .title-bar {
    background: #4361EE;
    color: white;
    padding: 18px 36px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .title-bar span { font-size: 14px; opacity: 0.75; font-weight: normal; }
  svg {
    position: absolute;
    top: 70px; left: 0;
    width: 1400px; height: 830px;
  }
</style>
</head>
<body>
<div class="title-bar">Earth Workers 未来完了ロードマップ ── Phase 0 → 3 <span>年商1億円 × 営業しなくても仕事が来る状態へ</span></div>
<svg viewBox="0 0 1400 830">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4361EE"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="glow-gold">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-blue">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4361EE" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ======= ASCENDING SPINE ======= -->
  <!-- diagonal guide (faint) -->
  <line x1="130" y1="700" x2="1290" y2="210" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- ======= START: 今すぐやる1アクション ======= -->
  <ellipse cx="130" cy="720" rx="90" ry="44" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="712" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">今すぐ</text>
  <text x="130" y="730" text-anchor="middle" fill="#64748B" font-size="11">START</text>

  <rect x="18" y="778" rx="12" ry="12" width="224" height="50" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="130" y="798" text-anchor="middle" fill="#78350F" font-size="11" font-weight="bold">▶ 新本牧・小田原</text>
  <text x="130" y="816" text-anchor="middle" fill="#92400E" font-size="11">Earth Workers版 短尺2〜3分</text>

  <!-- arrow: START → Phase0 -->
  <line x1="218" y1="698" x2="328" y2="635" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ======= PHASE 0: 〜2026年末 ======= -->
  <ellipse cx="380" cy="615" rx="110" ry="55" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="600" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">Phase 0</text>
  <text x="380" y="620" text-anchor="middle" fill="#64748B" font-size="11">〜2026年末</text>

  <!-- Phase 0 在り方 badge -->
  <rect x="248" y="690" rx="12" ry="12" width="264" height="64" fill="white" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="714" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">信頼される職人</text>
  <text x="380" y="736" text-anchor="middle" fill="#64748B" font-size="11">目の前の1本を圧倒的品質で</text>
  <line x1="380" y1="671" x2="380" y2="688" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Sub tags Phase 0 -->
  <rect x="250" y="530" rx="10" ry="10" width="130" height="36" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="315" y="553" text-anchor="middle" fill="#5B21B6" font-size="11">現場×映画品質</text>
  <rect x="390" y="520" rx="10" ry="10" width="110" height="36" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="445" y="543" text-anchor="middle" fill="#065F46" font-size="11">友達作戦 開始</text>

  <!-- arrow: Phase0 → Phase1 -->
  <line x1="488" y1="593" x2="618" y2="510" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ======= PHASE 1: 2027年 ======= -->
  <ellipse cx="680" cy="474" rx="120" ry="58" fill="#DBEAFE" stroke="#4361EE" stroke-width="2.5" filter="url(#shadow)" filter="url(#glow-blue)"/>
  <text x="680" y="458" text-anchor="middle" fill="#1E3A8A" font-size="14" font-weight="bold">Phase 1</text>
  <text x="680" y="478" text-anchor="middle" fill="#2563EB" font-size="12">2027年</text>
  <text x="680" y="496" text-anchor="middle" fill="#3B82F6" font-size="11">リテイナー初契約</text>

  <!-- Phase 1 在り方 badge -->
  <rect x="544" y="556" rx="12" ry="12" width="272" height="64" fill="white" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="580" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="bold">業界の語り部</text>
  <text x="680" y="601" text-anchor="middle" fill="#3B82F6" font-size="11">来た案件を選べる状態へ</text>
  <line x1="680" y1="533" x2="680" y2="554" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- Sub tags Phase 1 -->
  <rect x="548" y="390" rx="10" ry="10" width="140" height="36" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="618" y="413" text-anchor="middle" fill="#92400E" font-size="11">HACKT開始</text>
  <rect x="700" y="380" rx="10" ry="10" width="130" height="36" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="765" y="403" text-anchor="middle" fill="#065F46" font-size="11">業界で語られ始める</text>

  <!-- arrow: Phase1 → Phase2 -->
  <line x1="798" y1="448" x2="918" y2="360" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ======= PHASE 2: 2028年 ======= -->
  <ellipse cx="985" cy="320" rx="125" ry="60" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="985" y="302" text-anchor="middle" fill="#78350F" font-size="14" font-weight="bold">Phase 2</text>
  <text x="985" y="323" text-anchor="middle" fill="#92400E" font-size="12">2028年</text>
  <text x="985" y="342" text-anchor="middle" fill="#B45309" font-size="11">単価3倍・チーム体制</text>

  <!-- Phase 2 在り方 badge -->
  <rect x="843" y="402" rx="12" ry="12" width="284" height="64" fill="white" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="985" y="426" text-anchor="middle" fill="#78350F" font-size="13" font-weight="bold">なくてはならない存在</text>
  <text x="985" y="447" text-anchor="middle" fill="#92400E" font-size="11">指名・紹介で仕事が来る状態</text>
  <line x1="985" y1="381" x2="985" y2="400" stroke="#FCD34D" stroke-width="1.5"/>

  <!-- Sub tags Phase 2 -->
  <rect x="840" y="234" rx="10" ry="10" width="140" height="36" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="910" y="257" text-anchor="middle" fill="#1E40AF" font-size="11">業界OL確立</text>
  <rect x="998" y="224" rx="10" ry="10" width="150" height="36" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="1073" y="247" text-anchor="middle" fill="#5B21B6" font-size="11">自走するチームへ</text>

  <!-- arrow: Phase2 → Phase3 -->
  <line x1="1106" y1="293" x2="1220" y2="220" stroke="#4361EE" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- ======= PHASE 3: 2029年 GOAL ======= -->
  <ellipse cx="1295" cy="183" rx="85" ry="83" fill="#4361EE" filter="url(#glow-blue)"/>
  <text x="1295" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Phase 3</text>
  <text x="1295" y="175" text-anchor="middle" fill="white" font-size="12" opacity="0.9">2029年</text>
  <text x="1295" y="195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">GOAL</text>
  <text x="1295" y="215" text-anchor="middle" fill="white" font-size="11" opacity="0.85">各自 年商1億</text>
  <text x="1295" y="232" text-anchor="middle" fill="#A5F3FC" font-size="11">★</text>

  <!-- Phase 3 在り方 badge -->
  <rect x="1095" y="302" rx="12" ry="12" width="310" height="80" fill="white" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/>
  <text x="1250" y="328" text-anchor="middle" fill="#1E3A8A" font-size="13" font-weight="bold">地球を守る仕事を</text>
  <text x="1250" y="348" text-anchor="middle" fill="#1E3A8A" font-size="13" font-weight="bold">世界に届ける人たち</text>
  <text x="1250" y="370" text-anchor="middle" fill="#3B82F6" font-size="11">営業ゼロ / Kudoなしでも現場が回る</text>
  <line x1="1250" y1="267" x2="1250" y2="300" stroke="#4361EE" stroke-width="1.5"/>

  <!-- ======= LEFT AXIS LABEL ======= -->
  <text x="52" y="460" fill="#94A3B8" font-size="12" writing-mode="vertical-rl" text-anchor="middle" transform="rotate(180,52,450)">成長・信頼・影響力</text>
  <line x1="68" y1="720" x2="68" y2="200" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="74" y="720" fill="#CBD5E1" font-size="11">低</text>
  <text x="74" y="205" fill="#CBD5E1" font-size="11">高</text>

  <!-- ======= BOTTOM TIMELINE LABELS ======= -->
  <text x="130" y="810" text-anchor="middle" fill="#94A3B8" font-size="11">2026.6</text>
  <text x="380" y="810" text-anchor="middle" fill="#94A3B8" font-size="11">〜2026.12</text>
  <text x="680" y="810" text-anchor="middle" fill="#94A3B8" font-size="11">2027</text>
  <text x="985" y="810" text-anchor="middle" fill="#94A3B8" font-size="11">2028</text>
  <text x="1295" y="810" text-anchor="middle" fill="#4361EE" font-size="12" font-weight="bold">2029</text>

  <!-- HORIZONTAL TIME AXIS -->
  <line x1="90" y1="796" x2="1360" y2="796" stroke="#E2E8F0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="790" x2="130" y2="796" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="380" y1="790" x2="380" y2="796" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="680" y1="790" x2="680" y2="796" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="985" y1="790" x2="985" y2="796" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1295" y1="790" x2="1295" y2="796" stroke="#4361EE" stroke-width="2"/>

  <!-- ======= 鍵メッセージ ======= -->
  <rect x="90" y="470" rx="12" ry="12" width="220" height="56" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="200" y="492" text-anchor="middle" fill="#78350F" font-size="11" font-weight="bold">在り方が変わると</text>
  <text x="200" y="512" text-anchor="middle" fill="#92400E" font-size="11">行動が変わり、結果が変わる</text>
</svg>
</body>
</html>
