<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1400px; height: 900px; overflow: hidden; background: #EEF2FF;
    font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; }
  .header { background: #4361EE; color: white; padding: 15px 36px; display: flex; align-items: center; gap: 20px; }
  .badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; }
  .header h1 { font-size: 19px; font-weight: 800; }
  .header .sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }
</style>
</head>
<body>
<div class="header">
  <div class="badge">EARTHWORKERS</div>
  <div>
    <h1>紹介システム設計 ── 業界は狭い。1社が3社を呼ぶ仕組みの全体像</h1>
    <div class="sub">「誰か紹介してもらえますか？」の一言をどのタイミングで・何を渡して・どう言うか</div>
  </div>
</div>
<svg viewBox="0 0 1400 838" width="1400" height="838">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4361EE1A"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4361EE"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- ===== LEFT: なぜ紹介が効くか ===== -->
  <rect x="28" y="18" rx="10" width="390" height="32" fill="#7209B7"/>
  <text x="48" y="39" fill="white" font-size="13" font-weight="800">🏗️  なぜ土木業界で紹介が効くか</text>

  <!-- Reason cards -->
  <rect x="28" y="60" rx="12" width="390" height="78" fill="white" stroke="#7209B7" stroke-width="2" filter="url(#sh)"/>
  <rect x="28" y="60" rx="12" width="8" height="78" fill="#7209B7"/>
  <text x="50" y="84" fill="#7209B7" font-size="11" font-weight="800">業界が極端に狭い</text>
  <text x="50" y="104" fill="#555" font-size="11">海洋土木の主要プレイヤーは全国で20〜30社程度。</text>
  <text x="50" y="120" fill="#555" font-size="11">部長・担当者レベルは「飲み仲間」「同期」「元同僚」。</text>
  <text x="50" y="132" fill="#888" font-size="10">→ 同業者の口コミが、広告より100倍信頼される。</text>

  <rect x="28" y="148" rx="12" width="390" height="78" fill="white" stroke="#F72585" stroke-width="2" filter="url(#sh)"/>
  <rect x="28" y="148" rx="12" width="8" height="78" fill="#F72585"/>
  <text x="50" y="172" fill="#F72585" font-size="11" font-weight="800">同じ課題を全員が持っている</text>
  <text x="50" y="192" fill="#555" font-size="11">採用難・技術継承・イメージ低下は業界全社の共通課題。</text>
  <text x="50" y="208" fill="#555" font-size="11">「うちも全く同じ問題を抱えてる」が出発点。</text>
  <text x="50" y="220" fill="#888" font-size="10">→ Kotobukiの事例は全社に刺さる。</text>

  <rect x="28" y="236" rx="12" width="390" height="78" fill="white" stroke="#4CC9F0" stroke-width="2" filter="url(#sh)"/>
  <rect x="28" y="236" rx="12" width="8" height="78" fill="#4CC9F0"/>
  <text x="50" y="260" fill="#0369A1" font-size="11" font-weight="800">紹介は「信用の貸し借り」</text>
  <text x="50" y="280" fill="#555" font-size="11">「〇〇さんが紹介してくれた会社」という文脈がつくと</text>
  <text x="50" y="296" fill="#555" font-size="11">初対面でも信頼のベースラインが高い。</text>
  <text x="50" y="308" fill="#888" font-size="10">→ 営業コスト・時間が激減する。</text>

  <rect x="28" y="324" rx="12" width="390" height="78" fill="white" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
  <rect x="28" y="324" rx="12" width="8" height="78" fill="#059669"/>
  <text x="50" y="348" fill="#059669" font-size="11" font-weight="800">土木人はデジタルで探さない</text>
  <text x="50" y="368" fill="#555" font-size="11">Google検索・SNSで「ドキュメンタリーマーケティング」は調べない。</text>
  <text x="50" y="384" fill="#555" font-size="11">飲み会・業界団体・知人の紹介が唯一の情報入口。</text>
  <text x="50" y="396" fill="#888" font-size="10">→ だから紹介こそがリード獲得の本道。</text>

  <!-- ===== CENTER: 紹介サイクル ===== -->
  <rect x="448" y="18" rx="10" width="500" height="32" fill="#4361EE"/>
  <text x="468" y="39" fill="white" font-size="13" font-weight="800">🔄  紹介スノーボール ── 1社→3社→9社の雪だるま式拡大</text>

  <!-- Kotobuki node -->
  <circle cx="698" cy="128" r="54" fill="#FFF0F8" stroke="#F72585" stroke-width="2.5" filter="url(#sh)"/>
  <text x="698" y="118" text-anchor="middle" fill="#F72585" font-size="10" font-weight="800">起点</text>
  <text x="698" y="136" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="700">Kotobuki</text>
  <text x="698" y="152" text-anchor="middle" fill="#888" font-size="10">Kensetsu</text>

  <!-- Arrows to 3 companies -->
  <path d="M 698 182 Q 530 230 498 290" stroke="#4361EE" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <path d="M 698 182 L 698 270" stroke="#4361EE" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <path d="M 698 182 Q 870 230 900 290" stroke="#4361EE" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>

  <text x="570" y="236" fill="#4361EE" font-size="10" font-weight="700">「飲み仲間の〇〇さんに話してみる」</text>

  <!-- 3 companies -->
  <circle cx="498" cy="330" r="44" fill="white" stroke="#4361EE" stroke-width="2" filter="url(#sh)"/>
  <text x="498" y="323" text-anchor="middle" fill="#4361EE" font-size="10" font-weight="700">Wakachiku</text>
  <text x="498" y="339" text-anchor="middle" fill="#888" font-size="10">Kensetsu</text>

  <circle cx="698" cy="330" r="44" fill="white" stroke="#4361EE" stroke-width="2" filter="url(#sh)"/>
  <text x="698" y="323" text-anchor="middle" fill="#4361EE" font-size="10" font-weight="700">Goyo</text>
  <text x="698" y="339" text-anchor="middle" fill="#888" font-size="10">Kensetsu</text>

  <circle cx="898" cy="330" r="44" fill="white" stroke="#4361EE" stroke-width="2" filter="url(#sh)"/>
  <text x="898" y="323" text-anchor="middle" fill="#4361EE" font-size="10" font-weight="700">Toyo</text>
  <text x="898" y="339" text-anchor="middle" fill="#888" font-size="10">Kensetsu</text>

  <!-- Arrows to 9 companies -->
  <path d="M 498 374 L 468 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>
  <path d="M 498 374 L 548 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>
  <path d="M 698 374 L 668 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>
  <path d="M 698 374 L 728 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>
  <path d="M 898 374 L 868 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>
  <path d="M 898 374 L 928 440" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3"/>

  <!-- 6 small companies -->
  <circle cx="468" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="468" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="468" y="482" text-anchor="middle" fill="#059669" font-size="9">会社A</text>
  <circle cx="548" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="548" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="548" y="482" text-anchor="middle" fill="#059669" font-size="9">会社B</text>
  <circle cx="668" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="668" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="668" y="482" text-anchor="middle" fill="#059669" font-size="9">会社C</text>
  <circle cx="748" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="748" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="748" y="482" text-anchor="middle" fill="#059669" font-size="9">会社D</text>
  <circle cx="868" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="868" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="868" y="482" text-anchor="middle" fill="#059669" font-size="9">会社E</text>
  <circle cx="948" cy="474" r="30" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="948" y="470" text-anchor="middle" fill="#059669" font-size="9">次の</text>
  <text x="948" y="482" text-anchor="middle" fill="#059669" font-size="9">会社F</text>

  <!-- Year labels -->
  <text x="698" y="78" text-anchor="middle" fill="#F72585" font-size="10" font-weight="800">Year 1</text>
  <text x="698" y="248" text-anchor="middle" fill="#4361EE" font-size="10" font-weight="800">Year 2</text>
  <text x="698" y="418" text-anchor="middle" fill="#059669" font-size="10" font-weight="800">Year 3</text>

  <!-- Count badges -->
  <rect x="826" y="104" rx="8" width="76" height="24" fill="#FFF0F8" stroke="#F72585" stroke-width="1"/>
  <text x="864" y="120" text-anchor="middle" fill="#F72585" font-size="10" font-weight="700">1社 → スタート</text>
  <rect x="826" y="305" rx="8" width="76" height="24" fill="#EEF2FF" stroke="#4361EE" stroke-width="1"/>
  <text x="864" y="321" text-anchor="middle" fill="#4361EE" font-size="10" font-weight="700">累計 4社</text>
  <rect x="826" y="448" rx="8" width="76" height="24" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="864" y="464" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">累計 10社</text>

  <!-- ===== RIGHT: 設計の3要素 ===== -->
  <rect x="968" y="18" rx="10" width="404" height="32" fill="#F72585"/>
  <text x="988" y="39" fill="white" font-size="13" font-weight="800">🎯  紹介を生む設計の3要素</text>

  <!-- Element 1: タイミング -->
  <rect x="968" y="60" rx="12" width="404" height="106" fill="white" stroke="#F72585" stroke-width="2" filter="url(#sh)"/>
  <circle cx="994" cy="84" r="16" fill="#F72585"/>
  <text x="994" y="89" text-anchor="middle" fill="white" font-size="13" font-weight="800">①</text>
  <text x="1022" y="82" fill="#F72585" font-size="12" font-weight="800">タイミング ── いつ聞くか</text>
  <text x="988" y="104" fill="#1a1a2e" font-size="12" font-weight="700">納品直後が黄金タイミング</text>
  <text x="988" y="122" fill="#555" font-size="11">感謝のピーク時に聞く。受注から数ヶ月後では遅い。</text>
  <text x="988" y="140" fill="#555" font-size="11">「完成しました！ありがとうございます」の直後の一言。</text>
  <text x="988" y="158" fill="#888" font-size="10">× 営業中・制作中に聞くのは早すぎる</text>

  <!-- Element 2: 言葉 -->
  <rect x="968" y="176" rx="12" width="404" height="136" fill="white" stroke="#4361EE" stroke-width="2" filter="url(#sh)"/>
  <circle cx="994" cy="200" r="16" fill="#4361EE"/>
  <text x="994" y="205" text-anchor="middle" fill="white" font-size="13" font-weight="800">②</text>
  <text x="1022" y="198" fill="#4361EE" font-size="12" font-weight="800">言葉 ── どう聞くか</text>
  <rect x="988" y="212" rx="6" width="376" height="28" fill="#EEF2FF"/>
  <text x="1000" y="230" fill="#4361EE" font-size="11" font-weight="700">✅「もし気が向いたら、同業の方に話してみていただけると嬉しいです」</text>
  <rect x="988" y="248" rx="6" width="376" height="28" fill="#EEF2FF"/>
  <text x="1000" y="266" fill="#4361EE" font-size="11" font-weight="700">✅「名刺を1枚渡してもらえるだけで十分です」</text>
  <text x="988" y="298" fill="#EF4444" font-size="11">❌「紹介してください」→ 重すぎる・断りにくい</text>
  <text x="988" y="308" fill="#888" font-size="10">→ 相手が「気軽にできる」レベルまで下げる。</text>

  <!-- Element 3: 材料 -->
  <rect x="968" y="322" rx="12" width="404" height="136" fill="white" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
  <circle cx="994" cy="346" r="16" fill="#059669"/>
  <text x="994" y="351" text-anchor="middle" fill="white" font-size="13" font-weight="800">③</text>
  <text x="1022" y="344" fill="#059669" font-size="12" font-weight="800">材料 ── 何を渡すか</text>
  <text x="988" y="368" fill="#555" font-size="11">紹介者が「これ送っておくね」と言える素材を渡す。</text>
  <rect x="988" y="382" rx="6" width="376" height="24" fill="#ECFDF5"/>
  <text x="1000" y="398" fill="#059669" font-size="11" font-weight="700">🎬 2分動画のURL（LINEで転送できる）</text>
  <rect x="988" y="412" rx="6" width="376" height="24" fill="#ECFDF5"/>
  <text x="1000" y="428" fill="#059669" font-size="11" font-weight="700">📄 A4提案書PDF（メール添付できる）</text>
  <text x="988" y="450" fill="#888" font-size="10">→ 紹介者が「宣伝してる」ではなく「共有してる」感覚になる素材</text>

  <!-- Bonus: お礼 -->
  <rect x="968" y="468" rx="12" width="404" height="80" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="988" y="492" fill="#B45309" font-size="12" font-weight="800">💝 おまけ：紹介してくれた会社へのお礼</text>
  <text x="988" y="514" fill="#555" font-size="11">お金ではない。追加で動画コンテンツを1本作る。</text>
  <text x="988" y="532" fill="#555" font-size="11">「紹介いただいたので、採用用バージョンも作りますね」</text>
  <text x="988" y="542" fill="#888" font-size="10">→ 恩返しが次の紹介を生む。善循環。</text>

  <!-- Bottom summary -->
  <rect x="28" y="560" rx="12" width="1344" height="62" fill="white" stroke="#4361EE" stroke-width="1.5" filter="url(#sh)"/>
  <text x="700" y="584" text-anchor="middle" fill="#4361EE" font-size="13" font-weight="800">紹介システムの本質</text>
  <text x="700" y="606" text-anchor="middle" fill="#333" font-size="12">「売る」のではなく「共有してもらう」。紹介者が動きやすい材料 ＋ 言葉 ＋ タイミングの3点を設計するだけ。</text>

  <!-- Flow at bottom -->
  <text x="120" y="652" text-anchor="middle" fill="#333" font-size="11" font-weight="700">納品完了</text>
  <path d="M 166 648 L 220 648" stroke="#4361EE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="310" y="652" text-anchor="middle" fill="#333" font-size="11" font-weight="700">一言 ＋ 素材を渡す</text>
  <path d="M 400 648 L 454 648" stroke="#4361EE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="550" y="652" text-anchor="middle" fill="#333" font-size="11" font-weight="700">紹介者がLINE/飲み会で共有</text>
  <path d="M 650 648 L 704 648" stroke="#4361EE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="800" y="652" text-anchor="middle" fill="#333" font-size="11" font-weight="700">次の会社から問い合わせ</text>
  <path d="M 896 648 L 950 648" stroke="#4361EE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1040" y="652" text-anchor="middle" fill="#333" font-size="11" font-weight="700">ピッチ → 受注</text>
  <path d="M 1090 648 L 1144 648" stroke="#059669" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="1270" y="652" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">新しい事例 → 繰り返す</text>

</svg>
</body>
</html>
