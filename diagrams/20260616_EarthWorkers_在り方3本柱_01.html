<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1400px; height: 900px; overflow: hidden;
    background: #EEF2FF;
    font-family: 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  }
  .title-bar {
    background: #4361EE;
    color: white;
    padding: 18px 36px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .title-bar span { font-size: 14px; opacity: 0.75; font-weight: normal; }
  svg {
    position: absolute;
    top: 70px; left: 0;
    width: 1400px; height: 830px;
  }
</style>
</head>
<body>
<div class="title-bar">Earth Workers 在り方 ── 3本柱 <span>ドキュメンタリーマーケティングチームの核心</span></div>
<svg viewBox="0 0 1400 830">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4361EE" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ======= CENTER HUB ======= -->
  <ellipse cx="700" cy="430" rx="175" ry="82" fill="#4361EE" filter="url(#glow)"/>
  <text x="700" y="410" text-anchor="middle" fill="white" font-size="17" font-weight="bold">Earth Workers</text>
  <text x="700" y="433" text-anchor="middle" fill="white" font-size="13" opacity="0.9">ドキュメンタリー</text>
  <text x="700" y="453" text-anchor="middle" fill="white" font-size="13" opacity="0.9">マーケティングチーム</text>

  <!-- ======= PILLAR 1: 現場×映画品質 (Left) ======= -->
  <line x1="530" y1="392" x2="340" y2="240" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <ellipse cx="258" cy="198" rx="158" ry="60" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="258" y="186" text-anchor="middle" fill="#4C1D95" font-size="15" font-weight="bold">現場 × 映画品質</text>
  <text x="258" y="208" text-anchor="middle" fill="#6D28D9" font-size="12">現場を知る映像</text>

  <!-- Sub: わかってる -->
  <rect x="30" y="305" rx="12" ry="12" width="218" height="70" fill="white" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="139" y="331" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">「ちゃんとわかってる」</text>
  <text x="139" y="352" text-anchor="middle" fill="#6D28D9" font-size="11">現場の人間が認める映像</text>
  <line x1="180" y1="258" x2="160" y2="303" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Sub: 映画のように美しい -->
  <rect x="275" y="285" rx="12" ry="12" width="210" height="70" fill="white" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="311" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">映画のように美しい</text>
  <text x="380" y="332" text-anchor="middle" fill="#6D28D9" font-size="11">他社との絶対的差異</text>
  <line x1="300" y1="258" x2="340" y2="283" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ======= PILLAR 2: データドリブン (Top) ======= -->
  <line x1="700" y1="348" x2="700" y2="178" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-amber)"/>

  <ellipse cx="700" cy="124" rx="192" ry="58" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="109" text-anchor="middle" fill="#78350F" font-size="15" font-weight="bold">データドリブン・ドキュメンタリー</text>
  <text x="700" y="132" text-anchor="middle" fill="#92400E" font-size="12">HACKT 戦略</text>

  <!-- Sub: 会社固有ファクト -->
  <rect x="434" y="215" rx="12" ry="12" width="218" height="70" fill="white" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="543" y="241" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">会社固有のファクト</text>
  <text x="543" y="262" text-anchor="middle" fill="#92400E" font-size="11">施工データ・現場記録</text>
  <line x1="610" y1="182" x2="590" y2="213" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Sub: データ→物語 -->
  <rect x="748" y="215" rx="12" ry="12" width="218" height="70" fill="white" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="857" y="241" text-anchor="middle" fill="#B45309" font-size="12" font-weight="bold">データ → 物語へ変換</text>
  <text x="857" y="262" text-anchor="middle" fill="#92400E" font-size="11">技術資産をコンテンツ化</text>
  <line x1="790" y1="182" x2="820" y2="213" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ======= PILLAR 3: 友達作戦 (Right) ======= -->
  <line x1="872" y1="390" x2="1065" y2="240" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <ellipse cx="1148" cy="198" rx="158" ry="60" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1148" y="186" text-anchor="middle" fill="#064E3B" font-size="15" font-weight="bold">友達作戦</text>
  <text x="1148" y="208" text-anchor="middle" fill="#065F46" font-size="12">長期関係構築</text>

  <!-- Sub: 海洋・陸上土木の友人 -->
  <rect x="930" y="305" rx="12" ry="12" width="218" height="70" fill="white" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1039" y="331" text-anchor="middle" fill="#065F46" font-size="12" font-weight="bold">海洋・陸上土木の友人</text>
  <text x="1039" y="352" text-anchor="middle" fill="#047857" font-size="11">発注者ではなく同志として</text>
  <line x1="1080" y1="258" x2="1065" y2="303" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Sub: 業界オピニオンリーダー -->
  <rect x="1170" y="285" rx="12" ry="12" width="210" height="70" fill="white" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1275" y="311" text-anchor="middle" fill="#065F46" font-size="12" font-weight="bold">業界オピニオンリーダー</text>
  <text x="1275" y="332" text-anchor="middle" fill="#047857" font-size="11">取材され・語られる側へ</text>
  <line x1="1210" y1="258" x2="1240" y2="283" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ======= ROLE BADGES ======= -->
  <rect x="50" y="555" rx="14" ry="14" width="220" height="60" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="578" text-anchor="middle" fill="#5B21B6" font-size="13" font-weight="bold">Kudo の強み</text>
  <text x="160" y="598" text-anchor="middle" fill="#6D28D9" font-size="11">現場ファクト・技術知識</text>

  <rect x="1130" y="555" rx="14" ry="14" width="220" height="60" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1240" y="578" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="bold">鈴木の強み</text>
  <text x="1240" y="598" text-anchor="middle" fill="#2563EB" font-size="11">物語・映像品質・世界語へ</text>

  <!-- ======= BOTTOM POSITION BOX ======= -->
  <line x1="700" y1="514" x2="700" y2="618" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="200" y1="615" x2="380" y2="646" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1200" y1="615" x2="1020" y2="646" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="305" y="622" rx="22" ry="22" width="790" height="96" fill="white" stroke="#4361EE" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="655" text-anchor="middle" fill="#1E3A8A" font-size="16" font-weight="bold">「地球を守る仕事を、映像と物語で世界に届ける」</text>
  <text x="700" y="680" text-anchor="middle" fill="#3B82F6" font-size="13">陸上・海洋土木 専門ドキュメンタリーマーケティングチーム</text>
  <text x="700" y="700" text-anchor="middle" fill="#94A3B8" font-size="12">Kudo（現場ファクト）× 鈴木（物語・映像品質）= 他社には代替できない存在</text>

  <!-- ======= FOOTER NOTE ======= -->
  <text x="700" y="775" text-anchor="middle" fill="#64748B" font-size="12">3本柱が揃って初めて「営業しなくても仕事が来る」チームになる</text>
</svg>
</body>
</html>
